name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [codex/ipa-sideload]
    paths-ignore: ['docs/**', 'README.md']

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SPRINTER_SIDELOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check sources and build variant
        run: |
          npm run typecheck
          node scripts/check-sideload-config.cjs
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install iOS pods
        working-directory: ios
        run: pod install
      - name: Compile and package unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh
      - name: Upload IPA and installation notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sprinter-unsigned-ipa
          path: .build/ipa/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-log
          path: .build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
