<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:24px;background:#F2F0E9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#171719">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:18px;padding:28px">
      <tr><td>
        <p style="font-size:12px;letter-spacing:1.4px;font-weight:700;color:#606066;margin:0 0 12px">SPRINTER</p>
        <h1 style="font-size:22px;margin:0 0 16px">Votre code pour créer votre compte</h1>
        <p style="font-size:15px;line-height:23px;margin:0 0 20px">Saisissez ce code dans l’application Sprinter pour créer votre compte. Il expire dans 10 minutes.</p>
        <p style="font-size:34px;font-weight:700;letter-spacing:8px;margin:0 0 20px;font-variant-numeric:tabular-nums">{{ .Token }}</p>
        <p style="font-size:13px;line-height:19px;color:#606066;margin:0">Vous n’avez rien demandé ? Ignorez ce message : aucun compte ne sera créé sans ce code.</p>
      </td></tr>
    </table>
  </body>
</html>
